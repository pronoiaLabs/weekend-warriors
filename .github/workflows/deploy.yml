name: deploy

# Deploy only what a change actually affects.
#
# A `changes` job computes path filters once, and every downstream job gates on its
# output. Editing a registry YAML resyncs the registry and reapplies Tasks without
# rebuilding a container; editing Python rebuilds the image; editing a dbt model
# rebuilds models and leaves the ingestion side alone.
#
# Auth is keyless: GitHub OIDC -> a Snowflake TYPE=SERVICE user with a matching
# WORKLOAD_IDENTITY. No credential is stored anywhere. The only repo secret is the
# account identifier. See dlt-pipelines/sql/prod/03b_service_user_oidc.sql, which
# also covers the network policy override without which none of this can connect.
# The CLI install + OIDC auth + connection preflight live in one composite
# action (.github/actions/snowflake-setup), SHA-pinned because it holds
# id-token: write.
#
# NOT ON EVERY PUSH: main and manual dispatch only, gated on the `deploy` GitHub
# environment so required reviewers can sit in front of a production change. The
# environment name is part of the OIDC subject claim; renaming it here breaks
# authentication until 03b is updated to match.
#
# WHAT THIS DELIBERATELY DOES NOT DO: run anything under dlt-pipelines/sql/. Those
# files create roles, compute pools, databases and grants, several as SYSADMIN,
# USERADMIN or ACCOUNTADMIN. They stay a reviewed `make setup-*` run by a human.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

# Two deploys applying Task DDL at once would race, and the loser's CREATE OR ALTER
# would leave Tasks in a state neither run intended. Queue instead of cancelling:
# a half-applied deploy is worse than a slow one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }} # DLT_DEPLOYER
  SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }} # DLT_LOADER_ROLE
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }} # DLT_WH
  SNOWFLAKE_DATABASE: DLT_DB

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.decide.outputs.image }}
      registry: ${{ steps.decide.outputs.registry }}
      tasks: ${{ steps.decide.outputs.tasks }}
      dev_specs: ${{ steps.decide.outputs.dev_specs }}
      dbt: ${{ steps.decide.outputs.dbt }}
      agents: ${{ steps.decide.outputs.agents }}
      dashboard: ${{ steps.decide.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        # A manual dispatch has no base commit to diff against, so the filter is
        # skipped entirely and `decide` below turns everything on. That makes the
        # Run workflow button mean "deploy all of it", which is what you want when
        # you are recovering from a partial failure.
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            image:
              - 'dlt-pipelines/pipelines/**'
              - 'dlt-pipelines/pyproject.toml'
              - 'dlt-pipelines/uv.lock'
              - 'dlt-pipelines/deploy/spcs/Dockerfile'
            registry:
              - 'dlt-pipelines/pipelines/batch/registries/**'
            tasks:
              - 'dlt-pipelines/pipelines/batch/registries/**'
              - 'dlt-pipelines/deploy/spcs/dlt_job.tmpl.yaml'
              - 'dlt-pipelines/deploy/tasks/generate_tasks.py'
            dev_specs:
              - 'dlt-pipelines/deploy/spcs/dlt_dev_job*.tmpl.yaml'
            dbt:
              - 'dbt-pipelines/**'
            agents:
              - 'dbt-pipelines/agents/**'
            dashboard:
              - 'ops-dashboard/**'

      - name: Decide what to deploy
        id: decide
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          F: ${{ toJSON(steps.filter.outputs) }}
        run: |
          for k in image registry tasks dev_specs dbt agents dashboard; do
            if [ "$DISPATCH" = "true" ]; then
              v=true
            else
              v=$(echo "$F" | python3 -c \
                "import json,sys;print(json.load(sys.stdin).get('$k','false'))")
            fi
            echo "$k=$v" >> "$GITHUB_OUTPUT"
            echo "$k=$v"
          done

  # ---------------------------------------------------------------------------
  # Container image
  # ---------------------------------------------------------------------------
  # Built on a native linux/amd64 runner because SPCS compute pools are x86_64.
  # This is the right place for it: an Apple Silicon laptop has to emulate amd64
  # through QEMU, which turns a two-minute build into a long one.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: dlt-pipelines
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/snowflake-setup

      - name: Log in to the Snowflake image registry
        # -x everywhere: the OIDC auth is a temporary connection, and a bare
        # snow command fails with "Connection default is not configured".
        run: snow spcs image-registry login -x

      - name: Build and push (linux/amd64)
        run: |
          host="$(snow spcs image-registry url -x)"
          # Docker references must be lowercase; Snowflake maps this back to
          # DLT_DB.DEPLOY.IMAGES.
          target="$host/dlt_db/deploy/images/dlt-pipeline:latest"
          echo "Building and pushing $target"
          docker build --platform linux/amd64 -f deploy/spcs/Dockerfile -t "$target" .
          docker push "$target"

  # ---------------------------------------------------------------------------
  # Registry resync
  # ---------------------------------------------------------------------------
  # --emit-sql / generate_tasks need only pyyaml (no dlt, no Snowflake connector),
  # which is why models.py is kept import-free. The deploy runner stays lean.
  registry:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: dlt-pipelines
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/snowflake-setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Sync registries/*.yml into OPS.PIPELINE_REGISTRY
        run: |
          python -m pipelines.batch.registry_sync --emit-sql --prune > registry_sync.sql
          echo "----- registry_sync.sql -----" && cat registry_sync.sql
          snow sql -f registry_sync.sql -x

  # ---------------------------------------------------------------------------
  # Tasks
  # ---------------------------------------------------------------------------
  tasks:
    needs: [changes, image, registry]
    # `always()` is load-bearing. `image` and `registry` are skipped far more often
    # than they run, and a bare `needs:` propagates a skip, which would silently
    # stop Tasks from ever being reapplied. The guard is "did not FAIL", not "ran".
    if: |
      always()
      && needs.changes.outputs.tasks == 'true'
      && needs.image.result != 'failure'
      && needs.registry.result != 'failure'
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: dlt-pipelines
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/snowflake-setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # THIS STEP IS NOT OPTIONAL AND MUST NOT BE REORDERED.
      #
      # CREATE OR ALTER TASK FAILS on a Task that is started:
      #   091421 (22000): Unable to update graph with root task <name> since that
      #   root task is not suspended
      # and changes nothing. `snow sql -f` stops at the first error, so applying
      # tasks.sql to a running fleet aborts before most of it is attempted, leaving
      # some Tasks on the new spec and some on the old with nothing saying which.
      # Measured against the live 17-Task fleet on 2026-08-08.
      #
      # ALTER TASK IF EXISTS ... SUSPEND is a clean no-op for a Task that does not
      # exist yet, so this is safe on a first deploy and on a partial fleet.
      - name: Suspend scheduled Tasks
        run: |
          python -m deploy.tasks.generate_tasks --suspend > suspend.sql
          echo "----- suspend.sql -----" && cat suspend.sql
          snow sql -f suspend.sql -x

      - name: Generate and apply per-pipeline Tasks
        run: |
          python -m deploy.tasks.generate_tasks > tasks.sql
          echo "----- tasks.sql -----" && cat tasks.sql
          snow sql -f tasks.sql -x

      # THIS STEP IS NOT OPTIONAL AND MUST NOT BE REORDERED.
      #
      # CREATE OR ALTER TASK leaves a Task SUSPENDED. Without this, every deploy
      # that touches a registry file would silently stop the entire schedule: the
      # DDL succeeds, nothing errors, and the next cron fire never happens. That
      # failure has already happened once by hand.
      #
      # Resuming a Task that is already started is a no-op, so this is safe to
      # re-run and safe on a first deploy.
      - name: Resume scheduled Tasks
        run: |
          python -m deploy.tasks.generate_tasks --resume > resume.sql
          echo "----- resume.sql -----" && cat resume.sql
          snow sql -f resume.sql -x

      - name: Assert scheduled Tasks are started
        # CLAUDE.md: "Verify with SHOW TASKS, not with the target's exit code:
        # suspended looks exactly like success." The expected set comes from the
        # generator itself, so a paused sport (schedules commented out in its
        # registry, e.g. WNBA since 2026-08-12) is simply absent here and is
        # never asserted on or accidentally un-paused.
        run: |
          snow sql -x -q "SHOW TASKS IN SCHEMA DLT_DB.OPS;" --format json > show_tasks.json
          python3 - <<'PY'
          import json
          import re

          expected = {
              m.upper()
              for m in re.findall(r"DLT_DB\.OPS\.(DLT_TASK_\w+)", open("resume.sql").read(), re.I)
          }
          assert expected, "resume.sql named no tasks; generator output changed shape?"
          state = {t["name"].upper(): t["state"] for t in json.load(open("show_tasks.json"))}
          bad = {name: state.get(name, "MISSING") for name in sorted(expected) if state.get(name) != "started"}
          assert not bad, f"tasks not started after resume: {bad}"
          print(f"all {len(expected)} scheduled tasks started")
          PY

  # ---------------------------------------------------------------------------
  # Dev job spec templates
  # ---------------------------------------------------------------------------
  # Only the DEV templates are staged. Production Tasks carry their spec inline,
  # rendered by generate_tasks.py, because Snowflake's server-side template
  # renderer fails inside a Task: it resolves a dependency through
  # snowflake.snowpark.pypi_shared_repository, which the Task's role cannot reach.
  dev-specs:
    needs: changes
    if: needs.changes.outputs.dev_specs == 'true'
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: dlt-pipelines
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/snowflake-setup
      - name: Upload dev spec templates
        run: |
          for f in deploy/spcs/dlt_dev_job*.tmpl.yaml; do
            snow sql -x -q "PUT file://$PWD/$f @DLT_DB.DEPLOY.SPECS \
              AUTO_COMPRESS=FALSE OVERWRITE=TRUE;"
          done

  # ---------------------------------------------------------------------------
  # dbt
  # ---------------------------------------------------------------------------
  # One matrix leg per sport, because concurrent EXECUTE DBT PROJECT against a
  # single object is unsupported and each sport's trigger task fires its own
  # object (DLT_DB.DEPLOY.CORTEX_LIFECYCLE_<SPORT>). Deploying the object IS
  # the prod release step: the per-sport trigger tasks
  # (sql/sources/<sport>/05_dbt_trigger.sql) build when data lands, so there
  # is deliberately no `snow dbt execute build` here.
  #
  # The deploy runs as DBT_RUNNER_ROLE (job-level override), which makes it the
  # object's owner, and `make deploy-sport` carries the USAGE re-grant plus an
  # ownership normalization so laptop (SYSADMIN) and CI deploys converge on
  # DBT_RUNNER_ROLE owning the object -- neither path strands the other.
  dbt:
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    environment: deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          # WNBA paused 2026-08-12; add
          #   { sport: wnba, object: DLT_DB.DEPLOY.CORTEX_LIFECYCLE_WNBA }
          # here (and to the agents matrix) to revive.
          - { sport: nfl, object: DLT_DB.DEPLOY.CORTEX_LIFECYCLE_NFL }
          - { sport: ncaaf, object: DLT_DB.DEPLOY.CORTEX_LIFECYCLE_NCAAF }
    env:
      # DBT_RUNNER_ROLE owns the prod dbt estate; it has USAGE on DBT_WH only,
      # so the workflow-level DLT_WH must be overridden here.
      SNOWFLAKE_ROLE: DBT_RUNNER_ROLE
      SNOWFLAKE_WAREHOUSE: DBT_WH
      # The snow dbt --env / --default-env flags are feature-flagged.
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT_PROJECT_ENV_VARS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/snowflake-setup
      - name: Deploy ${{ matrix.object }}
        # The Makefile target is the single source of truth for the deploy +
        # re-grant + ownership sequence; CI passes CONN_ARGS=-x to use the
        # temporary OIDC connection instead of a named one.
        run: make -C dbt-pipelines deploy-sport SPORT=${{ matrix.sport }} CONN_ARGS=-x
      - name: Assert DBT_RUNNER_ROLE still holds the object
        # `snow dbt deploy --force` is CREATE OR REPLACE and drops grants. If
        # this regressed, the triggered builds would fail silently until the
        # task auto-suspends (measured: two days, Aug 2026). Fail loudly here
        # instead.
        run: |
          snow sql -x --format json \
            -q "SHOW GRANTS ON DBT PROJECT ${{ matrix.object }};" > grants.json
          python3 - <<'PY'
          import json

          rows = json.load(open("grants.json"))
          ok = any(
              row.get("grantee_name") == "DBT_RUNNER_ROLE"
              and row.get("privilege") in ("USAGE", "OWNERSHIP")
              for row in rows
          )
          assert ok, f"DBT_RUNNER_ROLE lost access to the project object: {rows}"
          print("DBT_RUNNER_ROLE grant verified")
          PY

  # ---------------------------------------------------------------------------
  # Cortex Agents
  # ---------------------------------------------------------------------------
  # Separate from `dbt` because an agent is a MACRO, not a model: `dbt build` does
  # not deploy it, and redeploying an agent on every model change is pure churn.
  # It needs the models to exist first, hence `needs: dbt`.
  #
  # `alter: true` updates in place rather than dropping and recreating, so a live
  # agent does not disappear mid-deploy. The --args quoting trick (embedded
  # quotes, or the CLI splits the token server-side) lives in the Makefile's
  # deploy-agent target, the single home for it.
  agents:
    needs: [changes, dbt]
    if: |
      always()
      && needs.changes.outputs.agents == 'true'
      && needs.dbt.result != 'failure'
    runs-on: ubuntu-latest
    environment: deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          # WNBA paused; revive together with the dbt matrix above.
          - { sport: nfl }
          - { sport: ncaaf }
    env:
      SNOWFLAKE_ROLE: DBT_RUNNER_ROLE
      SNOWFLAKE_WAREHOUSE: DBT_WH
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT_PROJECT_ENV_VARS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/snowflake-setup
      - name: Redeploy the ${{ matrix.sport }} analyst agent
        run: make -C dbt-pipelines deploy-agent SPORT=${{ matrix.sport }} CONN_ARGS=-x

  # ---------------------------------------------------------------------------
  # Ops dashboard
  # ---------------------------------------------------------------------------
  # Mirrors the manual flow in ops-dashboard/Makefile: image-push, spec-upload,
  # deploy. Independent of the dlt image and Task fleet (different image,
  # different service, no Task DDL), so it only needs `changes`; the workflow's
  # `deploy` concurrency group is the only serialization it requires.
  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: ops-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/snowflake-setup
      - name: Build and push ops-dashboard image
        # Tag = short git SHA, NEVER latest: ALTER SERVICE only rolls when the
        # rendered spec text changes, and a fixed tag makes every push a silent
        # no-op (ops-dashboard/Makefile).
        run: |
          tag="$(git rev-parse --short HEAD)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          snow spcs image-registry login -x
          host="$(snow spcs image-registry url -x)"
          target="$host/dlt_db/deploy/images/ops-dashboard:$tag"
          echo "Building and pushing $target"
          docker build --platform linux/amd64 -f deploy/spcs/Dockerfile -t "$target" .
          docker push "$target"
      - name: Upload the service spec template
        run: snow stage copy deploy/spcs/ops_dashboard.tmpl.yaml @DLT_DB.DEPLOY.SPECS --overwrite -x
      - name: Check whether the service exists
        # The dashboard can run local-only: the SPCS pool + service are a
        # deliberate human setup (`make -C ops-dashboard setup CONFIRM=1`,
        # always-on pool = real cost). Until that has been run there is
        # nothing to roll, and that is a notice, not a failure. The image and
        # spec above still ship, so going live later is just the setup run.
        id: svc
        run: |
          count=$(snow sql -x --role OPS_DASHBOARD_ROLE --format json \
            -q "SHOW SERVICES LIKE 'OPS_DASHBOARD' IN SCHEMA DLT_DB.DEPLOY;" \
            | python3 -c "import json, sys; print(len(json.load(sys.stdin)))")
          if [ "$count" = "0" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPS_DASHBOARD service not set up (dashboard is local-only). Image $TAG and spec pushed; roll skipped. Run make -C ops-dashboard setup CONFIRM=1 to go live."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Roll the service to the new tag
        if: steps.svc.outputs.exists == 'true'
        # OPS_DASHBOARD_ROLE owns the service, and ALTER SERVICE FROM a spec
        # requires ownership; this one statement switches role for that reason.
        run: |
          snow sql -x --role OPS_DASHBOARD_ROLE -q "ALTER SERVICE DLT_DB.DEPLOY.OPS_DASHBOARD
            FROM @DLT_DB.DEPLOY.SPECS
            SPECIFICATION_TEMPLATE_FILE = 'ops_dashboard.tmpl.yaml'
            USING (tag => '$TAG');"
      - name: Wait for the service to come back READY
        if: steps.svc.outputs.exists == 'true'
        run: |
          for i in $(seq 1 30); do
            snow sql -x --role OPS_DASHBOARD_ROLE --format json \
              -q "SELECT SYSTEM\$GET_SERVICE_STATUS('DLT_DB.DEPLOY.OPS_DASHBOARD') AS s;" > status.json
            state=$(python3 -c "import json; print(json.loads(json.load(open('status.json'))[0]['S'])[0]['status'])")
            echo "attempt $i: $state"
            [ "$state" = "READY" ] && exit 0
            [ "$state" = "FAILED" ] && { echo "service FAILED after roll"; exit 1; }
            sleep 10
          done
          echo "service not READY within 5 minutes"
          exit 1
