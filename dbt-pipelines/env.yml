# =============================================================================
# env.yml -- SQL environment variables for dbt Projects on Snowflake
# =============================================================================
# Snowflake resolves this file at EXECUTE DBT PROJECT time, picks the active
# environment, evaluates any SQL values, and injects the results as environment
# variables. profiles.yml then reads them with env_var(), so one profile drives
# every environment.
#
# What is environment-aware:
#   * prep / core / features / semantic_views / evaluations models build into
#     {DBT_DATABASE} automatically (they inherit the dbt target).
#   * The agent spec is a raw file dbt does not render, so create_agent /
#     alter_agent substitute <<DATABASE>>/<<SCHEMA>>/<<WAREHOUSE>> tokens.
#   * Raw sources (models/sources.yml) are intentionally NOT env-driven -- every
#     developer reads the same <SPORT>_PROD_DB.RAW input tables.
#   * DBT_SPORT picks which sport's model tree is enabled (see dbt_project.yml).
#     One environment builds exactly one sport into that sport's database; a
#     forgotten --select can never materialize one sport into the other's
#     database.
#
# Rules to remember:
#   * Keys must be DBT_ prefixed and UPPERCASE (DBT_SCHEMA, not schema).
#   * SQL values must be double-quoted: "{{ select CURRENT_USER() }}".
#   * env.yml lives next to dbt_project.yml (project root).
#
# See: https://docs.snowflake.com/en/user-guide/data-engineering/dbt-projects-on-snowflake-environment-variables
# =============================================================================

env_config:
  default_environment: dev
  environments:

    # -------------------------------------------------------------------------
    # dev -- per-developer isolation. Each engineer's models land in a single
    # schema named after their username. DBT_COLLAPSE_SCHEMAS=true makes
    # generate_schema_name ignore the per-layer +schema configs, so a developer
    # gets ONE schema (DEV_JSMITH) rather than four (DEV_JSMITH_PREP,
    # _CORE, _FEATURES, _ANALYTICS).
    # -------------------------------------------------------------------------
    - name: dev
      env:
        DBT_DATABASE: NFL_DEV_DB
        DBT_SCHEMA: "{{ select 'DEV_' || CURRENT_USER() }}"
        DBT_WAREHOUSE: DEVELOPMENT_WH
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_COLLAPSE_SCHEMAS: 'true'
        DBT_SPORT: nfl
        DBT_QUERY_TAG_BASE: '{"app":"dbt","sport":"nfl","env":"dev"}'

    # -------------------------------------------------------------------------
    # prod -- shared production schemas. DBT_COLLAPSE_SCHEMAS=false lets the
    # per-layer +schema configs in dbt_project.yml take effect, so models land
    # in NFL_PROD_DB.PREP / .CORE / .FEATURES / .ANALYTICS. DBT_SCHEMA is the fallback for
    # any model without an explicit +schema.
    #
    # Note: dlt owns NFL_PROD_DB.RAW and NFL_PROD_DB.RAW_STAGING. dbt must
    # never write to either.
    # -------------------------------------------------------------------------
    - name: prod
      env:
        DBT_DATABASE: NFL_PROD_DB
        DBT_SCHEMA: ANALYTICS
        DBT_WAREHOUSE: DBT_WH
        DBT_ROLE: DBT_RUNNER_ROLE
        DBT_COLLAPSE_SCHEMAS: 'false'
        DBT_SPORT: nfl
        DBT_QUERY_TAG_BASE: '{"app":"dbt","sport":"nfl","env":"prod"}'

    # -------------------------------------------------------------------------
    # wnba_dev / wnba_prod -- same two shapes, second sport. DBT_SPORT flips
    # the enabled model tree to models/wnba/ and the database to the WNBA pair.
    # dlt owns WNBA_PROD_DB.RAW and RAW_STAGING; dbt must never write to either.
    # -------------------------------------------------------------------------
    - name: wnba_dev
      env:
        DBT_DATABASE: WNBA_DEV_DB
        DBT_SCHEMA: "{{ select 'DEV_' || CURRENT_USER() }}"
        DBT_WAREHOUSE: DEVELOPMENT_WH
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_COLLAPSE_SCHEMAS: 'true'
        DBT_SPORT: wnba
        DBT_QUERY_TAG_BASE: '{"app":"dbt","sport":"wnba","env":"wnba_dev"}'

    - name: wnba_prod
      env:
        DBT_DATABASE: WNBA_PROD_DB
        DBT_SCHEMA: ANALYTICS
        DBT_WAREHOUSE: DBT_WH
        DBT_ROLE: DBT_RUNNER_ROLE
        DBT_COLLAPSE_SCHEMAS: 'false'
        DBT_SPORT: wnba
        DBT_QUERY_TAG_BASE: '{"app":"dbt","sport":"wnba","env":"wnba_prod"}'

    # -------------------------------------------------------------------------
    # ncaaf_dev / ncaaf_prod -- same two shapes, third sport. DBT_SPORT flips
    # the enabled model tree to models/ncaaf/ and the database to the NCAAF
    # pair. dlt owns NCAAF_PROD_DB.RAW and RAW_STAGING; dbt must never write
    # to either.
    # -------------------------------------------------------------------------
    - name: ncaaf_dev
      env:
        DBT_DATABASE: NCAAF_DEV_DB
        DBT_SCHEMA: "{{ select 'DEV_' || CURRENT_USER() }}"
        DBT_WAREHOUSE: DEVELOPMENT_WH
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_COLLAPSE_SCHEMAS: 'true'
        DBT_SPORT: ncaaf
        DBT_QUERY_TAG_BASE: '{"app":"dbt","sport":"ncaaf","env":"ncaaf_dev"}'

    - name: ncaaf_prod
      env:
        DBT_DATABASE: NCAAF_PROD_DB
        DBT_SCHEMA: ANALYTICS
        DBT_WAREHOUSE: DBT_WH
        DBT_ROLE: DBT_RUNNER_ROLE
        DBT_COLLAPSE_SCHEMAS: 'false'
        DBT_SPORT: ncaaf
        DBT_QUERY_TAG_BASE: '{"app":"dbt","sport":"ncaaf","env":"ncaaf_prod"}'
