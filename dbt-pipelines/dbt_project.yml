name: cortex_agent_lifecycle
version: '1.0.0'
config-version: 2

profile: cortex_agent_lifecycle

model-paths: ["models"]
macro-paths: ["macros", "agents"]   # agents/ holds per-agent deploy wrapper macros
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Functions the models call must exist before they build. Each macro here is
# gated on DBT_SPORT internally, so an NCAAF run creates nothing NFL.
on-run-start:
  - "{{ create_nfl_fantasy_udfs() }}"

models:
  cortex_agent_lifecycle:

    # -------------------------------------------------------------------------
    # nfl -- one league. Config is nested per sport, so each league is a
    # sibling key with its own settings.
    #
    # NOTE: the path nesting must match the folder nesting. These keys are
    # directory names, so models/nfl/prep/ requires nfl: > prep:. Flattening
    # them silently drops the materialization and +schema configs -- the models
    # still build, just as views in the default target schema.
    #
    # +enabled gates each sport on DBT_SPORT (set by env.yml): the target
    # database is one global value per run, so a run whose target is
    # NFL_*_DB must not be able to build NCAAF models into it, and vice versa.
    # The gate makes that structural instead of relying on --select discipline.
    # The 'nfl' default keeps a bare parse (no env.yml) building prod-shaped NFL.
    # -------------------------------------------------------------------------
    nfl:
      +tags: ['nfl']
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'nfl') | as_bool }}"

      # PREP -- thin views over NFL_PROD_DB.RAW. Rename, cast, strip the dlt
      # bookkeeping columns and the flattened parent payload, hash surrogate keys.
      # Views (not tables) because these are pass-through and the cost belongs in
      # DIM and FACTS, which materialize.
      prep:
        +materialized: view
        +schema: PREP

      # DIM + FACTS -- conformed dimensions and facts at declared grain. The
      # schema carries the role, so physical names drop the dim_/fact_ prefix
      # (macros/generate_alias_name.sql: folder-scoped strip + override map);
      # dbt model names are unchanged and every ref() compiles untouched. The
      # previous single CORE schema is frozen as the rollback archive -- see
      # docs/nfl-core-connection-strategy.html and sql/sources/nfl/10 in
      # dlt-pipelines.
      core:
        dimensions:
          +schema: DIM
          +materialized: table
        facts:
          +schema: FACTS
          +materialized: table
        # Id crosswalks to the other vendors, living beside the dims in DIM.
        # bridge_player_ids overrides to a view in its own config: its pre_hook
        # calls SP_PLAYER_BRIDGE, which writes the underlying table into this
        # same schema.
        bridges:
          +schema: DIM
          +materialized: table

      # FEATURES -- ML marts. Train and score only; not a Cortex tool.
      # Prod: NFL_PROD_DB.FEATURES. Dev collapses into DEV_<user>.
      features:
        +materialized: table
        +schema: FEATURES

      # APP -- serving layer for the analytics dashboard: page-shaped marts
      # read by a thin API. Not a Cortex tool. Prod: NFL_PROD_DB.APP; dev
      # collapses into DEV_<user>. copy_grants keeps ANALYTICS_DASHBOARD_ROLE's
      # SELECT across dbt's CREATE OR REPLACE (the role's FUTURE grant covers
      # brand-new marts; together they leave no gap).
      app:
        +materialized: table
        +schema: APP
        +copy_grants: true

      # ANALYTICS -- semantic views and evaluation datasets, consumed by agents.
      #
      # sv_example and eval_dataset are the upstream template's skeletons. They
      # reference the placeholder source that models/sources.yml replaced, so
      # they are disabled rather than deleted -- both carry substantial
      # authoring guidance in their comments that is worth keeping until the
      # real NFL semantic views are written on top of CORE.
      semantic_views:
        +materialized: semantic_view
        +schema: ANALYTICS
        sv_example:
          +enabled: false
      evaluations:
        +materialized: table
        +schema: ANALYTICS
        eval_dataset:
          +enabled: false

    # -------------------------------------------------------------------------
    # ncaaf -- second league, same layer shape. Differences live in the models:
    # completedness derives from the source's pre/post status (fake 0-0 totals
    # on scheduled rows), postseason is week 999 (no season_type exists for
    # this sport), and the rankings tree has no NFL sibling -- the AP-style
    # poll is unique to college.
    # -------------------------------------------------------------------------
    ncaaf:
      +tags: ['ncaaf']
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'ncaaf') | as_bool }}"

      prep:
        +materialized: view
        +schema: PREP

      core:
        +schema: CORE
        dimensions:
          +materialized: table
        facts:
          +materialized: table

      semantic_views:
        +materialized: semantic_view
        +schema: ANALYTICS

      # APP -- same contract as the NFL block; marts land here in a later phase.
      app:
        +materialized: table
        +schema: APP
        +copy_grants: true

tests:
  cortex_agent_lifecycle:
    # Singular tests are per-sport (tests/nfl/, tests/ncaaf/) and gate on
    # DBT_SPORT exactly like the model trees: a test whose refs are disabled
    # is a parse error, not a skip.
    nfl:
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'nfl') | as_bool }}"
    ncaaf:
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'ncaaf') | as_bool }}"

seeds:
  cortex_agent_lifecycle:
    nfl:
      +tags: ['nfl']
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'nfl') | as_bool }}"

sources:
  cortex_agent_lifecycle:
    # Sources gate on DBT_SPORT too, so their yml tests follow their sport.
    # Without this an NCAAF build runs the nfl_raw source tests and an NFL raw
    # data problem fails the NCAAF gate, defeating per-sport isolation.
    nfl_raw:
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'nfl') | as_bool }}"
    ncaaf_raw:
      +enabled: "{{ (env_var('DBT_SPORT', 'nfl') == 'ncaaf') | as_bool }}"
