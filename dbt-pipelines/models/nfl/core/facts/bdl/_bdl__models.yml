version: 2

# BallDontLie facts. Facts are organized by vendor/domain: bdl/ (this file,
# moved to bdl/ alongside its models), betting/, news/, weather/, nflverse/,
# sleeper/, each with its own models yml.

models:

  - name: fact_team_game_offense
    description: >
      One row per team per completed game: the team's OWN box score plus the
      game result. Grain: team x game. ~2,050 rows.
      GAMES unpivoted to team level (UNION ALL, cannot fan out) with the
      TEAM_STATS box score left-joined on. Four rows have has_box_score = false
      because two games have no team_stats row.
      Every box-score measure is offensive (sacks_allowed is sacks the team's
      QB took). The defensive view of the same game is fact_team_game_defense,
      1:1 on team_game_key.
      The nflverse EPA block (the retired fact_team_game_epa's offense half)
      is folded in from stg_nfl__nflverse_pbp on the same team_game_key -- a
      lossless 1:1 concat, present on 100% of non-preseason rows and NULL on
      preseason (has_nflverse flags it). EPA rates come from this grain's own
      sums; re-aggregate from the counts, never from the rates.
      Covers all season types -- filter on season_type, do not assume regular season.
    columns:
      - name: team_game_key
        description: "Surrogate key. Grain of this fact."
        tests: [unique, not_null]
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: opponent_team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: season_week_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_season_week')", field: season_week_key}
      - name: date_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_date')", field: date_key}
      - name: points_scored
        tests: [not_null]
      - name: points_allowed
        tests: [not_null]
      - name: is_home
        tests: [not_null]
      - name: has_box_score
        tests: [not_null]
      - name: third_down_conversions
        description: "NULL where has_box_score is false."
      - name: possession_time_seconds
        description: "NULL where has_box_score is false. Roughly 1800s per team per game."
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 5400, severity: warn}
      - name: has_nflverse
        description: "Whether the nflverse EPA block joined. False only on preseason rows (nflverse publishes no preseason play-by-play)."
        tests: [not_null]
      - name: off_epa_per_play
        description: "NULL where has_nflverse is false. A rate from this grain's sums; re-aggregate from off_epa / off_plays."

    tests:
      # the declared grain
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [game_id, team_id]

  - name: fact_team_game_defense
    description: >
      The same team-game seen from the defense. Grain: team x game, 1:1 with
      fact_team_game_offense on team_game_key.
      opp_* columns are the opponent's offensive box score read as "allowed"
      (a self-join of the offense fact, safe because that fact is mirrored);
      the pressure and coverage block is fact_player_game_defense rolled up
      to the team. takeaways is the opponent's turnovers, NOT a sum of
      fumbles_recovered, which counts own-fumble recoveries too.
      Two defensive_touchdowns columns are exposed on purpose: the provider's
      team box and the player rollup disagree on 155 rows.
      The def_* EPA-allowed block (the retired fact_team_game_epa's defense
      half) reads the opponent row's folded EPA columns through the same
      self-join as opp_*, so the twins can never disagree; NULL on preseason
      rows, flagged by has_nflverse.
    columns:
      - name: team_game_key
        description: "Surrogate key, identical to the offense row's. Grain of this fact."
        tests:
          - unique
          - not_null
          - relationships: {to: "ref('fact_team_game_offense')", field: team_game_key}
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: opponent_team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: season_week_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_season_week')", field: season_week_key}
      - name: date_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_date')", field: date_key}
      - name: points_allowed
        tests: [not_null]
      - name: has_opp_box_score
        description: "False on the rows whose opponent has no team_stats row; every opp_* measure is NULL there."
        tests: [not_null]
      - name: has_player_defense
        description: "Whether any player defensive stats rolled up for this team-game. False on the same 4 rows that lack a box score (two 2023 preseason games with no player stats at all); the pressure block is NULL there."
        tests: [not_null]
      - name: takeaways
        description: "The opponent's turnovers. NULL where has_opp_box_score is false."
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: sacks_recorded
        description: "Sum of player defensive_sacks. FLOAT: half-sacks are real. Agrees with opp_sacks_allowed within 1.0."
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: has_nflverse
        description: "Whether the EPA-allowed block joined (the opponent row's, see description). False only on preseason rows."
        tests: [not_null]

    tests:
      # the declared grain
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [game_id, team_id]

  # ---------------------------------------------------------------------------
  # Player-game phase facts.
  #
  # These three share a key space on purpose: 4,604 player-games have activity in
  # more than one phase and appear in more than one fact. Measure sets are
  # disjoint, so nothing is double-counted -- but row counts do NOT sum to 67,191
  # and the facts must never be UNIONed.
  # ---------------------------------------------------------------------------
  - name: fact_player_game_offense
    description: >
      Passing, rushing and receiving, all vendors. Grain: player x game.
      ~21,700 rows, anchored on the BallDontLie box score.
      Filtered to rows with offensive volume, not by position -- position is
      'Unknown' for 801 players who appear in box scores.
      The nflverse block (usage shares, EPA, first downs, explosive buckets,
      snaps) and the Sleeper block (the three fantasy scorings, pos ranks,
      snap share, drop/air-yard detail) join through the bridges; NULL means
      no match, never 0. Measured coverage excluding preseason: has_nflverse
      on 99.3% of regular-season and 99.2% of postseason rows, has_sleeper
      on 83.8% / 87.3%.
    columns:
      - name: player_game_key
        description: "Unique WITHIN this fact. Also appears in the other phase facts for multi-phase players."
        tests: [unique, not_null]
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: player_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_player')", field: player_key}
      - name: team_key
        description: "Team the player appeared for in THIS game."
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: season_week_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_season_week')", field: season_week_key}
      - name: scrimmage_yards
        description: "rushing + receiving yards, NULLs coalesced to 0."
        tests: [not_null]
      - name: touches
        tests: [not_null]
      - name: two_point_conversions
        description: "Two-point conversions rushed or caught, from play-by-play via fact_two_point_conversion. 0 when none."
        tests: [not_null]
      - name: two_point_conversions_thrown
        description: "Two-point conversion passes thrown, same source. 0 when none."
        tests: [not_null]
      - name: fanduel_points
        description: >
          FanDuel NFL scoring applied to this row (half PPR, 4-point passing TD,
          -1 INT, -2 fumble lost, 3-point yardage bonuses, 6 for own-fumble and
          return TDs, 2 per two-point conversion). Kickers are not scored. See
          the model header for what is deliberately not counted.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -10, max_value: 80, severity: warn}
      - name: draftkings_points
        description: >
          DraftKings Classic scoring applied to this row. Same thirteen inputs
          as fanduel_points; differs only in full PPR (1.0 per reception) and
          -1 per fumble lost. Kickers are not scored.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: -10, max_value: 80, severity: warn}
      - name: has_nflverse
        description: "Whether the nflverse week-stats block joined through the bridges. See the description for measured coverage."
        tests: [not_null]
      - name: has_sleeper
        tests: [not_null]
      - name: target_share
        description: "NULL where has_nflverse is false, like the whole nflverse block."
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, severity: warn}

  - name: fact_player_game_defense
    description: >
      Tackles, pressure and coverage, all vendors. Grain: player x game.
      ~42,300 rows, anchored on the BallDontLie box score.
      defensive_sacks is FLOAT -- half-sacks are real.
      The nflverse def_* block and Sleeper IDP columns keep their own names
      beside BallDontLie's readings (the providers disagree on attribution;
      coalescing would hide it). Measured coverage excluding preseason:
      has_nflverse on 98.6% / 99.1% (regular / post), has_sleeper on
      81.2% / 83.9% with IDP values on ~78% of matched rows.
    columns:
      - name: player_game_key
        tests: [unique, not_null]
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: player_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_player')", field: player_key}
      - name: team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: season_week_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_season_week')", field: season_week_key}
      - name: assisted_tackles
        description: "total_tackles - solo_tackles. NULL when either is missing or total < solo."
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: takeaways
        tests: [not_null]
      - name: has_nflverse
        description: "Whether the nflverse def_* block joined. On matched rows the block carries zeros, not NULLs, where nothing was recorded."
        tests: [not_null]
      - name: has_sleeper
        tests: [not_null]

  - name: fact_player_game_special
    description: >
      Kicking, punting and returns, all vendors. Grain: player x game.
      ~7,700 rows, anchored on the BallDontLie box score.
      Three sub-disciplines sharing one fact; use has_kicking / has_punting /
      has_returns to isolate them.
      nflverse fills BDL's gaps: field goals by distance band (made AND
      missed), the full PAT line (BDL has made only), punt placement, and
      snaps; its return counters are vendor-prefixed because BDL publishes
      the same stats. Measured coverage excluding preseason: has_nflverse on
      99.7% / 100% (regular / post, the best of the three player facts),
      has_sleeper on 78.3% / 83.0% with kicking values on actual kickers only.
    columns:
      - name: player_game_key
        tests: [unique, not_null]
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: player_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_player')", field: player_key}
      - name: team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: season_week_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_season_week')", field: season_week_key}
      - name: field_goal_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100, severity: warn}
      - name: total_returns
        tests: [not_null]
      - name: has_nflverse
        tests: [not_null]
      - name: has_sleeper
        tests: [not_null]
      - name: pat_att
        description: "nflverse. The attempts/missed/blocked/pct PAT line exists only in this block -- BDL carries extra_points_made alone."

  # ---------------------------------------------------------------------------
  # Play-by-play
  # ---------------------------------------------------------------------------
  - name: fact_play
    description: >
      Play-by-play (physical table PLAY_LOG). Grain: play. ~182k rows.
      Clustered on season, week. BDL is the spine; where the T1/T2/T3 cascade
      locates the play in nflverse pbp (99.7% of matchable plays, measured --
      docs/nfl-enrichment-columns.html), the nflverse analytics ride along.
      Unmatched plays keep NULL analytics, never imputed.
      Does NOT cover all games -- 18 games have no plays. Never use as a game spine.
    columns:
      - name: play_key
        tests: [unique, not_null]
      - name: play_id
        tests: [unique, not_null]
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: team_key
        description: "NULLABLE -- 126 neutral-event plays have no possessing team."
        tests:
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: play_type_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_play_type')", field: play_type_key}
      - name: season_week_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_season_week')", field: season_week_key}
      - name: home_win_probability
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, severity: warn}
      - name: is_matchable
        description: >
          Whether this play enters the nflverse match denominator:
          non-administrative type (dim_play_type.is_matchable), bridge-observed
          game, not preseason. False keeps the ~27k admin rows and all
          preseason out of the audit's rates.
        tests: [not_null]
      - name: match_tier
        description: >
          Which cascade tier matched the play. T1 exact five-key, T2 clock
          +/-15s, T3 yardline dropped + play-family agreement. NULL on the
          ~0.3% residual AND on non-matchable plays; read with is_matchable.
        tests:
          - accepted_values: {values: ['T1', 'T2', 'T3']}
      - name: nflverse_play_id
        description: >
          Drill-through key: with nflverse_game_id it addresses the matched
          row in stg_nfl__nflverse_pbp, one join away from the other ~360
          pbp columns. NULL where unmatched.
      - name: epa
        description: "nflverse graft, bare names -- BDL has no equivalents. NULL where unmatched."
      - name: success
        description: "nflverse graft: EPA > 0, as 0/1."
        tests:
          - accepted_values: {values: [0, 1], quote: false}

  - name: fact_play_match_audit
    description: >
      The play-level nflverse match rolled up per game over matchable plays
      only (physical table PLAY_MATCH_AUDIT). Grain: game; games with zero
      matchable plays (preseason) have no row. The tier split is the early
      warning -- a game going T3-heavy means clock or yardline drift even
      while the total rate holds. Watched by
      tests/nfl/assert_play_match_rate_above_floor (97% per game / 99%
      overall, warn).
    columns:
      - name: game_key
        tests:
          - unique
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: matchable_plays
        tests: [not_null]
      - name: match_rate
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}

  # ---------------------------------------------------------------------------
  # Season facts
  # ---------------------------------------------------------------------------
  - name: fact_team_season
    description: >
      Final standings. Grain: team x season. 96 rows.
      A snapshot fact -- measures are end-of-season states, so playoff_seed is
      not additive even though wins is.
    columns:
      - name: team_season_key
        tests: [unique, not_null]
      - name: team_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_team')", field: team_key}
      - name: season
        tests: [not_null]
      - name: win_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: games_played
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 18}
      - name: conference_rank
        description: >
          Conference standing rank 1-16. NULL until the provider assigns
          ranks -- a new season's preseason snapshot carries 0 upstream,
          nulled in prep. This is the column the source mislabels as
          playoff_seed. not_null is scoped to team-seasons with a
          regular-season result, where a missing rank is a real defect.
        tests:
          - not_null:
              config: {where: "wins + losses + ties > 0"}
          - dbt_utils.accepted_range: {min_value: 1, max_value: 16}
      - name: playoff_seed
        description: "The real seed: conference_rank where <= 7, else NULL. 7 teams per conference qualify."
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 7}
      - name: made_playoffs
        description: >
          Derived as conference_rank <= 7, NOT from NULLability of the
          source's playoff_seed. NULL while the team is unranked, same
          scope as conference_rank.
        tests:
          - not_null:
              config: {where: "wins + losses + ties > 0"}
      - name: bye_week
        description: >
          The missing week in the team's regular-season slate, derived from
          dim_game (exactly one per team-season, weeks 5-14, verified).
          Populated for future seasons too, since dim_game holds the full
          slate before a snap is played. warn, not error: a standings season
          whose slate has not landed yet would be NULL without being wrong.
        tests:
          - not_null: {config: {severity: warn}}
          - dbt_utils.accepted_range: {min_value: 5, max_value: 14, severity: warn}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_id, season]

  - name: fact_two_point_conversion
    description: >
      Two-point conversion attempts parsed from play-by-play text and credited
      to the players who ran, threw or caught them. Grain: play x role x
      participant; a pass yields a passer row and a receiver row. Names are
      resolved against the roster that appeared in that game for that team;
      player_key is NULL when they did not, and resolution_method says why.
      Consumed by fact_player_game_offense for fanduel_points.
    columns:
      - name: two_point_key
        tests: [unique, not_null]
      - name: play_key
        tests:
          - not_null
          - relationships: {to: "ref('fact_play')", field: play_key}
      - name: game_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_game')", field: game_key}
      - name: player_key
        description: "NULL for ambiguous, unresolved and unparsed rows."
        tests:
          - relationships: {to: "ref('dim_player')", field: player_key}
      - name: role
        tests:
          - not_null
          - accepted_values: {values: ['rush', 'receive', 'pass', 'unparsed']}
      - name: is_success
        tests: [not_null]
      - name: text_format
        tests:
          - not_null
          - accepted_values: {values: ['gsis', 'espn']}
      - name: resolution_method
        tests:
          - not_null
          - accepted_values: {values: ['exact', 'exact_role', 'alias', 'team_roster', 'ambiguous', 'unresolved']}
