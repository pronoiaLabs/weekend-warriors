version: 2

sources:
  - name: nfl_raw
    description: >
      Raw NFL data landed by dlt from the BallDontLie API. Owned by the dlt
      pipeline -- dbt reads this schema and must never write to it.

      Deliberately NOT environment-driven: every developer reads the same
      production raw tables, so dev models are built on real data.

      Grain note: dlt flattens parent records into every child row, so most
      tables carry a full GAME__* / TEAM__* / PLAYER__* payload alongside their
      own columns. The prep layer strips that back down to foreign keys.
    database: NFL_PROD_DB
    schema: RAW

    # dlt writes an epoch-seconds float as _dlt_load_id on every row. Decoding
    # it gives a real load timestamp for freshness without needing OPS._DLT_LOADS.
    loaded_at_field: "TO_TIMESTAMP_TZ(_dlt_load_id::FLOAT::NUMBER)"
    freshness:
      warn_after: {count: 2, period: day}
      error_after: {count: 7, period: day}

    tables:

      # ---------------------------------------------------------------------
      # Reference / dimension sources
      # ---------------------------------------------------------------------
      - name: teams
        description: "The 32 NFL teams. Static reference data."
        columns:
          - name: id
            description: "BallDontLie team ID. Natural key."
            tests: [unique, not_null]
          - name: conference
            tests:
              - accepted_values: {values: ['AFC', 'NFC']}
          - name: abbreviation
            tests: [unique, not_null]

      - name: players
        description: >
          Player roster. Holds each player's CURRENT team only -- there is no
          team history in this source. Historical per-game team affiliation
          comes from stats.team__id instead, which is accurate as-loaded.
          Height, weight and experience arrive as TEXT and are cast in prep.
        columns:
          - name: id
            description: "BallDontLie player ID. Natural key."
            tests: [unique, not_null]
          - name: team__id
            description: "Current team. Verified non-null for all 13,503 rows."
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: games
        description: >
          One row per game, 2023 season onward, including the full current
          season's schedule of unplayed games. Home and away scores sit side by
          side; the core layer unpivots this to team x game grain. Completed
          games are STATUS 'Final' or 'Final/OT'; scheduled games carry a
          kickoff-time string ('9/13 - 1:00 PM EDT') or 'TBD' for late-season
          flex slots, and a live in-progress value could land mid-load, so
          status is documented rather than value-tested. Scheduled rows carry
          NULL scores.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: season
            tests: [not_null]
          - name: season_type
            description: "1 = preseason, 2 = regular season, 3 = postseason."
            tests:
              - accepted_values: {values: [1, 2, 3], quote: false}
          - name: status
            description: >
              'Final' / 'Final/OT' when completed; a kickoff-time string or
              'TBD' when scheduled. Completedness is derived positively in
              stg_nfl__games as status in ('Final', 'Final/OT'), so an
              unexpected new value lands as not-completed rather than breaking.
            tests: [not_null]
          - name: home_team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}
          - name: visitor_team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Fact sources
      # ---------------------------------------------------------------------
      - name: team_stats
        description: >
          Team box score, one row per team per game. 2,000 rows against an
          expected 2,004 -- two games have no team_stats row, so the
          fact_team_game box score is null for those four team-game rows.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, team__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: stats
        description: >
          Player box score, one row per player per game, 116 columns spanning
          six phases of play (passing, rushing, receiving, defense, kicking,
          returns). Mostly NULL for any given player -- a punter's row has
          nothing in the passing columns. The core layer splits this by phase.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, player__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: team__id
            description: "Team the player appeared for in THIS game. The only historical team affiliation available."
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: plays
        description: >
          Play-by-play, one row per play. 18 games have no plays at all.
          126 plays have a null team (kickoffs and other neutral events), so
          team is intentionally nullable here.
          text / short_text hold natural-language play descriptions.
        columns:
          - name: id
            description: "Play ID. TEXT, not numeric."
            tests: [unique, not_null]
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: team__id
            description: "Nullable by design -- 126 neutral-event plays have no team."
            tests:
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: standings
        description: >
          Final regular-season standings, one row per team per season.
          Loaded by dlt as SCD2 (_dlt_valid_from / _dlt_valid_to); prep takes
          the current version only.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season, _dlt_valid_from]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}
          - name: season
            tests: [not_null]

      - name: player_injuries
        description: >
          Injury report. Only 21 rows today -- sparse, but grows with ongoing
          loads. dlt SCD2 like standings.
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}

      # ---------------------------------------------------------------------
      # Next Gen Stats -- player x season x week grain, NO game_id.
      # These conform to dim_player and dim_season_week but NOT to dim_game.
      # ---------------------------------------------------------------------
      - name: advanced_passing
        description: >
          Next Gen Stats passing, one row per player per season-week per
          postseason flag. No game_id in this source, so it cannot be joined
          to a specific game.

          WARNING: week = 0 rows are SEASON TOTALS, not a week. They do not
          reconcile with the sum of the weekly rows (50,025 attempts vs 47,392),
          so they are independent authoritative data. Never aggregate across
          week 0 and weeks 1+ together.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season, week, postseason]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: week
            description: "0 = season total, 1-18 = regular season week, 1-5 when postseason."
            tests: [not_null]

      - name: advanced_rushing
        description: "Next Gen Stats rushing. Same grain as advanced_passing."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season, week, postseason]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: week
            tests: [not_null]

      - name: advanced_receiving
        description: "Next Gen Stats receiving. Same grain as advanced_passing."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season, week, postseason]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: week
            tests: [not_null]

  - name: wnba_raw
    description: >
      Raw WNBA data landed by dlt from the BallDontLie API. Owned by the dlt
      pipeline -- dbt reads this schema and must never write to it.

      Deliberately NOT environment-driven, matching nfl_raw: every developer
      reads the same production raw tables.

      Grain note: dlt flattens parent records into every child row (GAME__* /
      TEAM__* / PLAYER__* payloads), and unlike NFL there are no child tables
      at all -- nested API objects became double-underscore columns.

      Variant-twin registry: where the API mixed ints and floats across rows,
      dlt split the column into <column> plus <column>__V_DOUBLE. Reading only
      the base column silently drops the float rows, so prep folds every twin
      back together with wnba_coalesce_variant(). Each affected table lists
      its twins in its description below; this is the canonical registry,
      auditable against INFORMATION_SCHEMA.COLUMNS LIKE '%__V_DOUBLE'.
    database: WNBA_PROD_DB
    schema: RAW

    loaded_at_field: "TO_TIMESTAMP_TZ(_dlt_load_id::FLOAT::NUMBER)"
    # Looser than nfl_raw: most WNBA pipelines are weekly Tuesday crons, so
    # one missed week warns and two missed weeks error.
    freshness:
      warn_after: {count: 9, period: day}
      error_after: {count: 16, period: day}

    tables:

      # ---------------------------------------------------------------------
      # Reference / dimension sources
      # ---------------------------------------------------------------------
      - name: teams
        description: >
          35 rows, of which only 15 are real franchises (IDs 1-15, including
          the defunct Sacramento Monarchs and Houston Comets) -- the rest are
          All-Star squads, national teams, TBD placeholders, and the 2026
          expansion teams Tempo (TOR) and Fire (POR). All 20 non-original rows
          have NULL conference, so there is no accepted_values test on
          conference and no unique test on abbreviation (the TBD placeholders
          share codes). stg_wnba__teams classifies every row instead of
          filtering any.
        columns:
          - name: id
            description: "BallDontLie team ID. Natural key."
            tests: [unique, not_null]

      - name: players
        description: >
          Player roster, 860 rows. Holds each player's CURRENT team only.
          WEIGHT and COLLEGE are corrupted upstream -- when weight is absent
          the college name shifts into the WEIGHT field (0 of 860 rows have a
          numeric weight), so prep drops both columns.
        columns:
          - name: id
            description: "BallDontLie player ID. Natural key."
            tests: [unique, not_null]
          - name: team__id
            description: "Current team. Verified non-null for all 860 rows."
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: games
        description: >
          One row per game, 2026 season only, 333 rows including All-Star,
          preseason and future scheduled games. STATUS is 'pre' (scheduled) or
          'post' (completed) today; a live-game status could appear mid-load,
          so status is documented rather than tested. POSTSEASON is a boolean;
          the full season-type classification (including All-Star and
          Preseason) is derived in stg_wnba__games.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: season
            tests: [not_null]
          - name: home_team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}
          - name: visitor_team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Box-score fact sources
      # ---------------------------------------------------------------------
      - name: player_stats
        description: >
          Player box score, one row per player per game, 5,751 rows. MIN is
          TEXT. NULL means ZERO for stat columns -- the API omits zero-valued
          keys -- except on DNP rows (MIN = '0'), where every stat is NULL.
          Prep applies the DNP-aware coalesce. Uses TURNOVER and PF where
          team_stats says TURNOVERS and FOULS; prep normalizes both sides.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, player__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'games')", field: id}
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}
          - name: team__id
            description: "Team the player appeared for in THIS game. The only historical team affiliation available."
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: team_stats
        description: >
          Team box score, one row per team per game, 476 rows (238 games x 2).
          Carries FG_PCT / FG3_PCT / FT_PCT which player_stats lacks.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, team__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'games')", field: id}
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: player_injuries
        description: >
          Injury report snapshot, 38 rows. dlt SCD2 (_dlt_valid_from /
          _dlt_valid_to); history accrues as the daily pipeline reruns.
          RETURN_DATE is TEXT.
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: standings
        description: >
          One row per team per season, dlt SCD2. The ONLY multi-season table:
          235 rows spanning 2008-2026 (all 19 seasons present). Split records
          (home/away/conference) are 'W-L' text with no tie position.
          Variant twins: GAMES_BEHIND__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season, _dlt_valid_from]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}
          - name: season
            tests: [not_null]

      # ---------------------------------------------------------------------
      # Season aggregate sources -- SEASON_TYPE is '2' (regular) / '3'
      # (playoffs) integer-as-text here, but 'regular' / 'playoffs' strings on
      # the advanced and shot-location tables. wnba_season_type_name()
      # normalizes all of it in prep.
      # ---------------------------------------------------------------------
      - name: player_season_stats
        description: >
          Basic per-season line, one row per player per season per season
          type, 196 rows (2026 only). SUBSET WARNING: covers fewer players
          than the advanced-season family (196 vs 224) -- never use this
          table as the spine of a player-season mart.
          Variant twins: FG3M__V_DOUBLE, FG3_PCT__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season, season_type]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: team_season_stats
        description: >
          Team per-season line, 15 rows (2026 regular season).
          Variant twins: FG3A__V_DOUBLE, OREB__V_DOUBLE, STL__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season, season_type]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Advanced stats -- unlike NFL's Next Gen sources, these cover ONE
      # unified player population: all five player_season_* tables span the
      # identical 224 players (verified pairwise in prod), because basketball
      # has no positional disciplines. This is why sv_wnba_player_advanced
      # ships enabled while sv_nfl_player_advanced is disabled.
      # ---------------------------------------------------------------------
      - name: player_game_advanced_stats
        description: >
          Advanced player box score, one row per player per game, 5,569 rows,
          124 columns with metrics nested under STATS__FOUR_FACTORS__* /
          STATS__ADVANCED__* / STATS__SCORING__* / STATS__USAGE__* /
          STATS__MISC__*. Covers fewer player-games than player_stats --
          fact_player_game_advanced left-joins accordingly.
          Variant twins (15): assist_to_turnover, estimated_net_rating,
          net_rating, offensive_rebound_percentage (advanced and four_factors),
          percentage_assisted3pt, percentage_points3pt,
          percentage_points_fast_break, percentage_unassisted3pt, and the
          usage percentage_{blocks, blocks_allowed, personal_fouls,
          rebounds_offensive, steals, three_pointers_made} -- all under their
          STATS__* prefixes.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, player__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'games')", field: id}
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: team_game_advanced_stats
        description: "Advanced team box score, one row per team per game, 466 rows, 94 columns, same STATS__* nesting."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, team__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'games')", field: id}
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: player_season_advanced
        description: >
          One row per player per season (224 rows, 2026 regular season only;
          SEASON_TYPE='regular', SCOPE/MEASURE_TYPE/PER_MODE are constants).
          Roughly half the columns are *_RANK league ranks, dropped in prep.
          Variant twins: STATS__MIN__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: player_season_misc
        description: "Same grain and population as player_season_advanced (224 rows)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: player_season_scoring
        description: >
          Same grain and population as player_season_advanced (224 rows).
          Variant twins: STATS__MIN__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: player_season_usage
        description: "Same grain and population as player_season_advanced (224 rows)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: player_season_defense
        description: "Same grain and population as player_season_advanced (224 rows)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: team_season_advanced
        description: "One row per team per season (15 rows, 2026 regular season)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: team_season_four_factors
        description: "Same grain as team_season_advanced (15 rows)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: team_season_opponent
        description: "Same grain as team_season_advanced (15 rows). Opponent-allowed measures."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Shot locations -- pivoted wide: STATS__SHOT_ZONES__<ZONE>__{FGA,FGM,
      # FG_PCT}. Zone names starting with a digit got a leading underscore
      # from dlt (STATS__SHOT_ZONES___30_34_FT__...). Core unpivots to long.
      # ---------------------------------------------------------------------
      - name: player_shots_by_zone
        description: >
          One row per player per season (223 rows), court-zone scheme
          (restricted area, paint, mid-range, corner/above-break 3, backcourt).
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: player_shots_5ft
        description: >
          One row per player per season (223 rows), 5-foot distance bands.
          Variant twins: STATS__SHOT_ZONES___30_34_FT__FG_PCT__V_DOUBLE,
          STATS__SHOT_ZONES___35_39_FT__FG_PCT__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'players')", field: id}

      - name: team_shots_by_zone
        description: >
          One row per team per season (15 rows), court-zone scheme.
          Variant twins: STATS__SHOT_ZONES__BACKCOURT__FG_PCT__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

      - name: team_shots_5ft
        description: >
          One row per team per season (15 rows), 5-foot distance bands.
          Variant twins: STATS__SHOT_ZONES___35_39_FT__FG_PCT__V_DOUBLE,
          STATS__SHOT_ZONES___40_FT__FG_PCT__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('wnba_raw', 'teams')", field: id}

  - name: ncaaf_raw
    description: >
      Raw NCAAF (college football) data landed by dlt from the BallDontLie
      API. Owned by the dlt pipeline -- dbt reads this schema and must never
      write to it. Deliberately NOT environment-driven, matching the other
      sports: every developer reads the same production raw tables.

      Grain note: like WNBA there are no child tables at all -- nested API
      objects became double-underscore columns, and dlt repeats the whole
      parent payload on every child row. One naming asymmetry is load-bearing:
      GAMES pairs VISITOR_TEAM__* team blocks with AWAY_SCORE_* score columns.

      Variant-twin registry: where the API mixed ints and floats across rows,
      dlt split the column into <column> plus <column>__V_DOUBLE. Reading only
      the base column silently drops the float rows, so prep folds every twin
      with ncaaf_coalesce_variant(). Seven twins across four tables, each
      listed in its table's description below; auditable against
      INFORMATION_SCHEMA.COLUMNS LIKE '%__V_DOUBLE'.
    database: NCAAF_PROD_DB
    schema: RAW

    loaded_at_field: "TO_TIMESTAMP_TZ(_dlt_load_id::FLOAT::NUMBER)"
    # Games and stats load daily but standings, season stats and rankings are
    # weekly Monday crons, so the WNBA thresholds apply: one missed week warns,
    # two error.
    freshness:
      warn_after: {count: 9, period: day}
      error_after: {count: 16, period: day}

    tables:

      # ---------------------------------------------------------------------
      # Reference / dimension sources
      # ---------------------------------------------------------------------
      - name: conferences
        description: >
          25 rows, FBS and FCS both (IDs 1-11 are FBS including 'FBS Indep.',
          12-25 FCS). ABBREVIATION equals NAME on every row, so prep keeps
          only one. The subdivision split is derived in stg_ncaaf__conferences
          from the ID ranges, verified against the live API.
        columns:
          - name: id
            description: "BallDontLie conference ID. Natural key."
            tests: [unique, not_null]

      - name: teams
        description: >
          536 rows covering FBS, FCS and below. CONFERENCE is a bare NUMBER
          id joining to conferences (the API's own spec wrongly documents a
          string) and is NULL for 29 rows, so it carries no not_null test.
          Only ~134 rows are FBS programs; stg_ncaaf__teams classifies every
          row rather than filtering any, the WNBA is_franchise pattern.
        columns:
          - name: id
            description: "BallDontLie team ID. Natural key."
            tests: [unique, not_null]
          - name: conference
            description: "Conference id, NULL for 29 independents/unmapped rows."
            tests:
              - relationships: {to: "source('ncaaf_raw', 'conferences')", field: id}

      - name: players
        description: >
          124,089 rows -- the largest reference table in the account, FBS+FCS
          rosters with churn. HEIGHT, WEIGHT and JERSEY_NUMBER are TEXT and
          arrived in a later schema evolution (NULL in early loads). Holds
          each player's current team only.
        columns:
          - name: id
            description: "BallDontLie player ID. Natural key."
            tests: [unique, not_null]
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Game-grain sources
      # ---------------------------------------------------------------------
      - name: games
        description: >
          One row per game, seasons 2024-2026, ~4,977 rows including the full
          2026 scheduled slate. STATUS is 'pre'/'post' with an undocumented
          STATUS_STATE ('scheduled'/'final'); a live value could appear
          mid-load so neither is tested with accepted_values. SCHEDULED ROWS
          CARRY FAKE ZERO TOTALS in HOME_SCORE/AWAY_SCORE with NULL quarter
          scores: completedness must derive from status, never from scores.
          Postseason (bowls, CFP) is WEEK 999 -- no season_type exists for
          this sport -- with one known upstream mislabel (the Jan 2025 Gator
          Bowl as week 1). Team blocks are VISITOR_TEAM__*, score columns are
          AWAY_SCORE_*; prep normalizes to home/away. HOME/AWAY_SCORE_OT
          arrived late (appended after _DLT_ID).
        columns:
          - name: id
            tests: [unique, not_null]
          - name: season
            tests: [not_null]
          - name: home_team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
          - name: visitor_team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}

      - name: player_stats
        description: >
          One row per player per completed game, ~173,688 rows. Embeds the
          full game payload (GAME__* including scores) but NOT the game's
          team blocks -- home/away identity joins from games. 22 stat fields:
          passing, rushing, receiving, tackles, sacks; no fumbles, no
          kicking/punting, no returns (the API does not carry them).
          Variant twins: TACKLES_FOR_LOSS__V_DOUBLE, PASSING_QBR__V_DOUBLE,
          SACKS__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, game__id]
        columns:
          - name: player__id
            tests: [not_null]
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'games')", field: id}

      - name: team_stats
        description: >
          One row per team per completed game, ~6,698 rows (a handful of
          completed games have no stat rows; fact_ncaaf_team_game anchors on
          games for exactly that reason). GAME__* here is the trimmed 4-field
          stub (id/date/season/week), unlike player_stats.
          THIRD_DOWN_EFFICIENCY / FOURTH_DOWN_EFFICIENCY are TEXT '5-12'
          made-attempts pairs and POSSESSION_TIME is TEXT '31:24'; prep
          parses all three. No variant twins.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, game__id]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'games')", field: id}

      # ---------------------------------------------------------------------
      # Season-grain sources
      # ---------------------------------------------------------------------
      - name: player_season_stats
        description: >
          One row per player per season, ~17,198 rows (2024-2025). Carries
          BOTH a top-level TEAM__* (the stat line's team) and a nested
          PLAYER__TEAM__* (the player's current team); they can disagree
          across transfers, and prep uses the stat-line TEAM__* only.
          Variant twin: RECEIVING_YARDS_PER_GAME__V_DOUBLE -- the most
          dangerous twin in the schema, because the base column is NUMBER and
          a per-game average is almost always fractional, so the base column
          alone is near-useless.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests: [not_null]

      - name: team_season_stats
        description: >
          One row per team per season, ~270 rows -- FBS coverage only
          (about 135 teams x 2 completed seasons). Includes opponent totals
          (OPP_PASSING_YARDS, OPP_RUSHING_YARDS) that exist nowhere else.
          Variant twin: PASSING_YARDS_PER_GAME__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Snapshot sources
      # ---------------------------------------------------------------------
      - name: standings
        description: >
          THE ONLY SCD2 TABLE IN THIS SOURCE: dlt loads it with merge/scd2,
          so rows carry _DLT_VALID_FROM/_DLT_VALID_TO and history accumulates
          weekly. Current rows are WHERE _DLT_VALID_TO IS NULL. One row per
          team per conference per season version; CONFERENCE__* here is the
          only denormalized conference block in the source. WINS is NULL on
          preseason rows (the API publishes 0-0 slates before kickoff).
          Records can carry ties historically. Variant twins:
          WIN_PERCENTAGE__V_DOUBLE, GAMES_BEHIND__V_DOUBLE.
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
          - name: season
            tests: [not_null]

      - name: rankings
        description: >
          AP-style poll, one row per season/week/rank, 25 rows per published
          week, weeks 2-16. NO POLL IDENTIFIER EXISTS -- the API exposes one
          poll and does not say which. The endpoint returns only the latest
          published week per call, so the weekly cron accumulates the season
          poll by poll and history was backfilled week by week. RECORD is a
          TEXT 'W-L' pair; TREND is text like '+1'/'-'. A rank tie produced
          one 26-row week in 2024.
        columns:
          - name: season
            tests: [not_null]
          - name: week
            tests: [not_null]
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
