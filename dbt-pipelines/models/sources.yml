version: 2

sources:
  - name: nfl_raw
    description: >
      Raw NFL data landed by dlt from the BallDontLie API. Owned by the dlt
      pipeline -- dbt reads this schema and must never write to it.

      Deliberately NOT environment-driven: every developer reads the same
      production raw tables, so dev models are built on real data.

      Grain note: dlt flattens parent records into every child row, so most
      tables carry a full GAME__* / TEAM__* / PLAYER__* payload alongside their
      own columns. The prep layer strips that back down to foreign keys.
    database: NFL_PROD_DB
    schema: RAW

    # dlt writes an epoch-seconds float as _dlt_load_id on every row. Decoding
    # it gives a real load timestamp for freshness without needing OPS._DLT_LOADS.
    loaded_at_field: "TO_TIMESTAMP_TZ(_dlt_load_id::FLOAT::NUMBER)"
    freshness:
      warn_after: {count: 2, period: day}
      error_after: {count: 7, period: day}

    tables:

      # ---------------------------------------------------------------------
      # Reference / dimension sources
      # ---------------------------------------------------------------------
      - name: teams
        description: "The 32 NFL teams. Static reference data."
        columns:
          - name: id
            description: "BallDontLie team ID. Natural key."
            tests: [unique, not_null]
          - name: conference
            tests:
              - accepted_values: {values: ['AFC', 'NFC']}
          - name: abbreviation
            tests: [unique, not_null]

      - name: players
        description: >
          Player roster. Holds each player's CURRENT team only -- there is no
          team history in this source. Historical per-game team affiliation
          comes from stats.team__id instead, which is accurate as-loaded.
          Height, weight and experience arrive as TEXT and are cast in prep.
        columns:
          - name: id
            description: "BallDontLie player ID. Natural key."
            tests: [unique, not_null]
          - name: team__id
            description: "Current team. Verified non-null for all 13,503 rows."
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: games
        description: >
          One row per game, 2023 season onward, including the full current
          season's schedule of unplayed games. Home and away scores sit side by
          side; the core layer unpivots this to team x game grain. Completed
          games are STATUS 'Final' or 'Final/OT'; scheduled games carry a
          kickoff-time string ('9/13 - 1:00 PM EDT') or 'TBD' for late-season
          flex slots, and a live in-progress value could land mid-load, so
          status is documented rather than value-tested. Scheduled rows carry
          NULL scores.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: season
            tests: [not_null]
          - name: season_type
            description: "1 = preseason, 2 = regular season, 3 = postseason."
            tests:
              - accepted_values: {values: [1, 2, 3], quote: false}
          - name: status
            description: >
              'Final' / 'Final/OT' when completed; a kickoff-time string or
              'TBD' when scheduled. Completedness is derived positively in
              stg_nfl__games as status in ('Final', 'Final/OT'), so an
              unexpected new value lands as not-completed rather than breaking.
            tests: [not_null]
          - name: home_team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}
          - name: visitor_team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Fact sources
      # ---------------------------------------------------------------------
      - name: team_stats
        description: >
          Team box score, one row per team per game. 2,000 rows against an
          expected 2,004 -- two games have no team_stats row, so the
          fact_team_game_offense box score is null for those four team-game rows.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, team__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: stats
        description: >
          Player box score, one row per player per game, 116 columns spanning
          six phases of play (passing, rushing, receiving, defense, kicking,
          returns). Mostly NULL for any given player -- a punter's row has
          nothing in the passing columns. The core layer splits this by phase.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game__id, player__id]
        columns:
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: team__id
            description: "Team the player appeared for in THIS game. The only historical team affiliation available."
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: plays
        description: >
          Play-by-play, one row per play. 18 games have no plays at all.
          126 plays have a null team (kickoffs and other neutral events), so
          team is intentionally nullable here.
          text / short_text hold natural-language play descriptions.
        columns:
          - name: id
            description: "Play ID. TEXT, not numeric."
            tests: [unique, not_null]
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: team__id
            description: "Nullable by design -- 126 neutral-event plays have no team."
            tests:
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}

      - name: standings
        description: >
          Final regular-season standings, one row per team per season.
          Loaded by dlt as SCD2 (_dlt_valid_from / _dlt_valid_to); prep takes
          the current version only.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season, _dlt_valid_from]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'teams')", field: id}
          - name: season
            tests: [not_null]

      - name: player_injuries
        description: >
          Injury report. Only 21 rows today -- sparse, but grows with ongoing
          loads. dlt SCD2 like standings.
        columns:
          - name: player__id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}

      # ---------------------------------------------------------------------
      # Betting markets. The live endpoints are dlt SCD2 snapshots; opening
      # endpoints are merge tables with one immutable API row per offer.
      # ---------------------------------------------------------------------
      - name: odds
        description: >
          Sportsbook game lines, dlt SCD2. Raw id repeats once per historical
          version, so uniqueness is id plus _dlt_valid_from, never id alone.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [id, _dlt_valid_from]
        columns:
          - name: id
            tests: [not_null]
          - name: game_id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: vendor
            tests: [not_null]
          - name: _dlt_valid_from
            tests: [not_null]

      - name: odds_opening
        description: >
          Immutable opening sportsbook lines. The API id is the endpoint row
          identifier and is unique under the merge contract.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: game_id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: vendor
            tests: [not_null]

      - name: player_props
        description: >
          Sportsbook player prop snapshots, dlt SCD2. Logical market grain is
          game x player x vendor x prop_type; API ids may differ within it.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [id, _dlt_valid_from]
        columns:
          - name: id
            tests: [not_null]
          - name: game_id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: player_id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: vendor
            tests: [not_null]
          - name: prop_type
            tests: [not_null]
          - name: _dlt_valid_from
            tests: [not_null]

      - name: player_props_opening
        description: >
          Immutable opening player prop offers. API id is unique under the
          merge contract; CORE resolves any duplicate logical markets
          deterministically.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: game_id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'games')", field: id}
          - name: player_id
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'players')", field: id}
          - name: vendor
            tests: [not_null]
          - name: prop_type
            tests: [not_null]

      # --- News: the Firecrawl source (dlt news-registry.yml), hourly -------
      - name: news_articles
        description: >
          One row per article URL discovered from the curated feeds and scraped
          through Firecrawl: feed metadata, the page as markdown, and the raw
          JSON extraction when the feed's extract mode fired. Merge on url.
          Text columns are large (markdown runs to ~100k chars), so downstream
          models name their columns rather than SELECT *.
        columns:
          - name: url
            description: "Canonical article URL from the feed. Natural key."
            tests: [unique, not_null]
          - name: feed
            description: "Registry feed name: pft, pfr, cbs, espn, or club_<abbr>."
            tests: [not_null]
          - name: fetched_at
            tests: [not_null]

      - name: news_player_mentions
        description: >
          One row per article x player name AS THE ARTICLE WROTE IT, from the
          JSON extraction. No provider id exists here, which is why CORE owns
          the match to a player and this source carries no relationship test
          to players.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [url, player_name]
        columns:
          - name: url
            tests:
              - not_null
              - relationships: {to: "source('nfl_raw', 'news_articles')", field: url}
          - name: player_name
            tests: [not_null]

      # --- Weather: the Open-Meteo source (dlt weather-registry.yml) --------
      - name: weather_hourly
        description: >
          Open-Meteo hourly weather at stadium grain. product is archive
          (ERA5 actuals), forecast (live outlook), or hist_forecast (what
          was knowable before kickoff). hour_at is UTC. No game_id — dbt
          joins the kickoff hour from dim_game.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [stadium_id, hour_at, product]
        columns:
          - name: stadium_id
            tests: [not_null]
          - name: hour_at
            tests: [not_null]
          - name: product
            tests: [not_null]

      # --- nflverse: season files read through nflreadpy (dlt nflverse-registry.yml)
      #
      # Vendor-prefixed because BallDontLie already owns players, player_injuries
      # and stats in this schema. gsis_id joins everything nflverse to everything
      # nflverse; to BallDontLie there is no shared id (name + team matches ~78%
      # of current players, see BACKLOG). Season-keyed tables merge on the keys
      # tested below and hold 2023 onward; the all-history files are replaced
      # weekly. Nothing models these yet.
      - name: nflverse_pbp
        description: >
          nflfastR play by play, one row per play, every column the file carries
          (372). EPA, WP, CPOE, air yards, drive and series context, the player
          ids on every role. Keep it an archive: stage only what a mart needs.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [game_id, play_id]
        columns:
          - name: game_id
            description: "nflverse game id, e.g. 2025_01_ARI_NO."
            tests: [not_null]
          - name: play_id
            tests: [not_null]
          - name: season
            tests: [not_null]

      - name: nflverse_player_stats
        description: >
          Player x game box score with usage and efficiency (150 columns):
          EPA by phase, cpoe, air yards and YAC, target_share, air_yards_share,
          wopr, racr, pacr, explosive-play buckets, first downs, the full
          defensive line, kicking by distance, punting, returns, and
          fantasy_points / fantasy_points_ppr. player_id is the gsis_id. The
          file's 22 nameless all-zero placeholder rows per season are dropped
          by the pipeline.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player_id, game_id]
        columns:
          - name: player_id
            description: "gsis_id."
            tests: [not_null]
          - name: game_id
            tests: [not_null]

      - name: nflverse_snap_counts
        description: >
          Player x game snap counts and percentages on offense, defense and
          special teams, keyed by Pro Football Reference ids (pfr_player_id
          maps to nflverse_players.pfr_id).
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [pfr_game_id, pfr_player_id]
        columns:
          - name: pfr_game_id
            tests: [not_null]
          - name: pfr_player_id
            tests: [not_null]

      - name: nflverse_nextgen_passing
        description: >
          Next Gen Stats passing, player x week (week 0 is the season total).
          Time to throw, air yards, aggressiveness, CPOE. One discipline per
          player: no overlap with the rushing and receiving tables.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [season, season_type, week, player_gsis_id]
        columns:
          - name: player_gsis_id
            tests: [not_null]

      - name: nflverse_nextgen_rushing
        description: >
          Next Gen Stats rushing, player x week (week 0 is the season total).
          Efficiency, time to line of scrimmage, rush yards over expected.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [season, season_type, week, player_gsis_id]
        columns:
          - name: player_gsis_id
            tests: [not_null]

      - name: nflverse_nextgen_receiving
        description: >
          Next Gen Stats receiving, player x week (week 0 is the season total).
          Cushion, separation, intended air yards share, YAC above expectation.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [season, season_type, week, player_gsis_id]
        columns:
          - name: player_gsis_id
            tests: [not_null]

      - name: nflverse_injuries
        description: >
          The league's official weekly injury report: report status and
          injuries plus practice status and injuries, player x team x week.
          The published report, weekly and lagging; Sleeper's injury fields
          are the live state.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [season, game_type, week, team, gsis_id]
        columns:
          - name: gsis_id
            tests: [not_null]
          - name: team
            tests: [not_null]

      - name: nflverse_depth_charts
        description: >
          Daily depth-chart snapshots, 2025 onward (the file changed shape that
          season; earlier years are nflverse_depth_charts_weekly): one row per
          team x position slot x rank per observation time (dt, an ISO string).
          Around 3k rows a day, every day of the year. season is stamped by the
          pipeline from the season file; the pipeline keeps a cursor on dt and
          loads only new snapshots. Empty slots (no player_name) are dropped.
          Read the latest dt for the current chart.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [dt, team, pos_id, pos_slot, pos_rank, player_name]
        columns:
          - name: dt
            tests: [not_null]
          - name: team
            tests: [not_null]
          - name: season
            tests: [not_null]

      - name: nflverse_depth_charts_weekly
        description: >
          The league's weekly depth chart through 2024: season x week x
          game_type x club_code x formation x depth_position x depth_team
          (1 = starter) with gsis_id. No clean natural key in the file (a few
          hundred exact duplicate rows per season, week NULL on ~200), so the
          pipeline merges on row_id, an md5 of the whole row, which collapses
          the duplicates. The week-keyed chart is the one to use for
          pre-kickoff features in 2023 and 2024.
        columns:
          - name: row_id
            tests: [unique, not_null]
          - name: season
            tests: [not_null]
          - name: club_code
            tests: [not_null]

      - name: nflverse_players
        description: >
          The id crosswalk, one row per player ever (25k): gsis_id, espn_id,
          pfr_id, pff_id, otc_id, esb_id, smart_id, plus names, position,
          college, draft, status, latest_team and headshot (an NFL.com static
          URL). Replaced weekly. Joining BallDontLie onto this by name + team
          is the images backlog item.
        columns:
          - name: gsis_id
            tests: [unique, not_null]

      - name: nflverse_officials
        description: "Officiating crew per game, 2015 onward. Replaced weekly."

      - name: nflverse_combine
        description: "Combine results 2000 onward with draft outcome and pfr_id. Replaced weekly."

      - name: nflverse_trades
        description: >
          Trade log 2002 onward, one row per asset moved (player by pfr_id, or
          pick by season/round/number), trade_id groups the sides. Replaced
          weekly.

      - name: nflverse_teams
        description: >
          Franchise branding: 36 rows (32 current teams plus LA/OAK/SD/STL
          legacy abbreviations, which is what lets history join cleanly across
          relocations) with conference/division, brand colors, and logo /
          wordmark URLs. Replaced weekly.
        columns:
          - name: team_abbr
            tests: [unique, not_null]

      # --- Sleeper: live player state and fantasy signal (dlt sleeper-registry.yml)
      #
      # Every run reads Sleeper's clock from /v1/state/nfl and stamps each row
      # with fetched_at and state_season / state_week / state_season_type.
      # Sleeper's id columns are sparse (espn_id on 769 and gsis_id on 577 of
      # 3,183 rostered active players, measured 2026-08-23); join to nflverse by
      # name + team and let the ids confirm the subset they cover.
      - name: sleeper_state
        description: "One row per pipeline run: the week clock Sleeper was on. Append."
        columns:
          - name: fetched_at
            tests: [not_null]

      - name: sleeper_players
        description: >
          Sleeper's full player dump, replaced daily (12k rows, including 32
          team DEF rows keyed by abbreviation). Live injury_status,
          injury_body_part, practice_participation, depth_chart_position and
          depth_chart_order, status, team, news_updated (epoch ms),
          search_rank, and the ids Sleeper holds (gsis_id, espn_id, kalshi_id,
          oddsjam_id, sportradar_id, yahoo_id, ...). metadata,
          fantasy_positions and competitions are VARIANT.
        columns:
          - name: player_id
            description: "Sleeper's own id; the key of the dump."
            tests: [unique, not_null]

      - name: sleeper_trending
        description: >
          Adds and drops across Sleeper leagues over the last 24 hours, top
          100 per direction, appended every pull. count is the number of
          leagues; rank is the position in that pull.
        columns:
          - name: player_id
            tests: [not_null]
          - name: direction
            tests:
              - accepted_values: {values: ['add', 'drop']}
          - name: fetched_at
            tests: [not_null]

      - name: sleeper_projections
        description: >
          Weekly projections for this week and next, appended every pull so
          the table is the projection's history. Stat keys are flattened to
          columns (pts_ppr, pts_half_ppr, pts_std, pass_yd, rush_att, rec,
          ...); preseason pulls carry only adp_dd_ppr, the stat columns arrive
          with the regular season. Read the latest fetched_at per player x
          week for the current number.
        columns:
          - name: player_id
            tests: [not_null]
          - name: season
            tests: [not_null]
          - name: week
            tests: [not_null]
          - name: fetched_at
            tests: [not_null]

      - name: sleeper_stats
        description: >
          Sleeper's weekly player stats (sportradar-fed) with fantasy points
          under std, half and full PPR and position ranks. Merged on player x
          season x season_type x week, so one row per played week.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player_id, season, season_type, week]
        columns:
          - name: player_id
            tests: [not_null]
          - name: week
            tests: [not_null]

  - name: ncaaf_raw
    description: >
      Raw NCAAF (college football) data landed by dlt from the BallDontLie
      API. Owned by the dlt pipeline -- dbt reads this schema and must never
      write to it. Deliberately NOT environment-driven, matching the other
      sports: every developer reads the same production raw tables.

      Grain note: there are no child tables -- nested API objects became
      double-underscore columns, and dlt repeats the whole
      parent payload on every child row. One naming asymmetry is load-bearing:
      GAMES pairs VISITOR_TEAM__* team blocks with AWAY_SCORE_* score columns.

      Variant-twin registry: where the API mixed ints and floats across rows,
      dlt split the column into <column> plus <column>__V_DOUBLE. Reading only
      the base column silently drops the float rows, so prep folds every twin
      with ncaaf_coalesce_variant(). Seven twins across four tables, each
      listed in its table's description below; auditable against
      INFORMATION_SCHEMA.COLUMNS LIKE '%__V_DOUBLE'.
    database: NCAAF_PROD_DB
    schema: RAW

    loaded_at_field: "TO_TIMESTAMP_TZ(_dlt_load_id::FLOAT::NUMBER)"
    # Games and stats load daily but standings, season stats and rankings are
    # weekly Monday crons: one missed week warns and two missed weeks error.
    freshness:
      warn_after: {count: 9, period: day}
      error_after: {count: 16, period: day}

    tables:

      # ---------------------------------------------------------------------
      # Reference / dimension sources
      # ---------------------------------------------------------------------
      - name: conferences
        description: >
          25 rows, FBS and FCS both (IDs 1-11 are FBS including 'FBS Indep.',
          12-25 FCS). ABBREVIATION equals NAME on every row, so prep keeps
          only one. The subdivision split is derived in stg_ncaaf__conferences
          from the ID ranges, verified against the live API.
        columns:
          - name: id
            description: "BallDontLie conference ID. Natural key."
            tests: [unique, not_null]

      - name: teams
        description: >
          536 rows covering FBS, FCS and below. CONFERENCE is a bare NUMBER
          id joining to conferences (the API's own spec wrongly documents a
          string) and is NULL for 29 rows, so it carries no not_null test.
          Only ~134 rows are FBS programs; stg_ncaaf__teams classifies every
          row rather than filtering any.
        columns:
          - name: id
            description: "BallDontLie team ID. Natural key."
            tests: [unique, not_null]
          - name: conference
            description: "Conference id, NULL for 29 independents/unmapped rows."
            tests:
              - relationships: {to: "source('ncaaf_raw', 'conferences')", field: id}

      - name: players
        description: >
          124,089 rows -- the largest reference table in the account, FBS+FCS
          rosters with churn. HEIGHT, WEIGHT and JERSEY_NUMBER are TEXT and
          arrived in a later schema evolution (NULL in early loads). Holds
          each player's current team only.
        columns:
          - name: id
            description: "BallDontLie player ID. Natural key."
            tests: [unique, not_null]
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Game-grain sources
      # ---------------------------------------------------------------------
      - name: games
        description: >
          One row per game, seasons 2024-2026, ~4,977 rows including the full
          2026 scheduled slate. STATUS is 'pre'/'post' with an undocumented
          STATUS_STATE ('scheduled'/'final'); a live value could appear
          mid-load so neither is tested with accepted_values. SCHEDULED ROWS
          CARRY FAKE ZERO TOTALS in HOME_SCORE/AWAY_SCORE with NULL quarter
          scores: completedness must derive from status, never from scores.
          Postseason (bowls, CFP) is WEEK 999 -- no season_type exists for
          this sport -- with one known upstream mislabel (the Jan 2025 Gator
          Bowl as week 1). Team blocks are VISITOR_TEAM__*, score columns are
          AWAY_SCORE_*; prep normalizes to home/away. HOME/AWAY_SCORE_OT
          arrived late (appended after _DLT_ID).
        columns:
          - name: id
            tests: [unique, not_null]
          - name: season
            tests: [not_null]
          - name: home_team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
          - name: visitor_team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}

      - name: player_stats
        description: >
          One row per player per completed game, ~173,688 rows. Embeds the
          full game payload (GAME__* including scores) but NOT the game's
          team blocks -- home/away identity joins from games. Stat fields:
          passing, rushing, receiving, tackles, sacks; no fumbles, no
          kicking/punting, no returns (the API does not carry them), and no
          receiving_targets column despite the spec (never non-null upstream,
          and dlt drops all-null columns).
          Variant twins: TACKLES_FOR_LOSS__V_DOUBLE, PASSING_QBR__V_DOUBLE,
          SACKS__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, game__id]
        columns:
          - name: player__id
            tests: [not_null]
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'games')", field: id}

      - name: team_stats
        description: >
          One row per team per completed game, ~6,698 rows (a handful of
          completed games have no stat rows; fact_ncaaf_team_game anchors on
          games for exactly that reason). GAME__* here is the trimmed 4-field
          stub (id/date/season/week), unlike player_stats.
          THIRD_DOWN_EFFICIENCY / FOURTH_DOWN_EFFICIENCY are TEXT '5-12'
          made-attempts pairs and POSSESSION_TIME is TEXT '31:24'; prep
          parses all three. No variant twins.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, game__id]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
          - name: game__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'games')", field: id}

      # ---------------------------------------------------------------------
      # Season-grain sources
      # ---------------------------------------------------------------------
      - name: player_season_stats
        description: >
          One row per player per season, ~17,198 rows (2024-2025). Carries
          BOTH a top-level TEAM__* (the stat line's team) and a nested
          PLAYER__TEAM__* (the player's current team); they can disagree
          across transfers, and prep uses the stat-line TEAM__* only.
          Variant twin: RECEIVING_YARDS_PER_GAME__V_DOUBLE -- the most
          dangerous twin in the schema, because the base column is NUMBER and
          a per-game average is almost always fractional, so the base column
          alone is near-useless.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [player__id, season]
        columns:
          - name: player__id
            tests: [not_null]

      - name: team_season_stats
        description: >
          One row per team per season, ~270 rows -- FBS coverage only
          (about 135 teams x 2 completed seasons). Includes opponent totals
          (OPP_PASSING_YARDS, OPP_RUSHING_YARDS) that exist nowhere else.
          Variant twin: PASSING_YARDS_PER_GAME__V_DOUBLE.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [team__id, season]
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}

      # ---------------------------------------------------------------------
      # Snapshot sources
      # ---------------------------------------------------------------------
      - name: standings
        description: >
          THE ONLY SCD2 TABLE IN THIS SOURCE: dlt loads it with merge/scd2,
          so rows carry _DLT_VALID_FROM/_DLT_VALID_TO and history accumulates
          weekly. Current rows are WHERE _DLT_VALID_TO IS NULL. One row per
          team per conference per season version; CONFERENCE__* here is the
          only denormalized conference block in the source. WINS is NULL on
          preseason rows (the API publishes 0-0 slates before kickoff).
          Records can carry ties historically. Variant twins:
          WIN_PERCENTAGE__V_DOUBLE, GAMES_BEHIND__V_DOUBLE.
        columns:
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
          - name: season
            tests: [not_null]

      - name: rankings
        description: >
          AP-style poll, one row per season/week/rank, 25 rows per published
          week, weeks 2-16. NO POLL IDENTIFIER EXISTS -- the API exposes one
          poll and does not say which. The endpoint returns only the latest
          published week per call, so the weekly cron accumulates the season
          poll by poll and history was backfilled week by week. RECORD is a
          TEXT 'W-L' pair; TREND is text like '+1'/'-'. A rank tie produced
          one 26-row week in 2024.
        columns:
          - name: season
            tests: [not_null]
          - name: week
            tests: [not_null]
          - name: team__id
            tests:
              - not_null
              - relationships: {to: "source('ncaaf_raw', 'teams')", field: id}
