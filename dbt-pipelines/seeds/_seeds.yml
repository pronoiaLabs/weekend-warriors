version: 2

seeds:
  - name: seed_nfl_player_aliases
    description: >
      Nicknames and shortenings the news uses that the roster does not: "Abe
      Lucas", "CMC". Consulted FIRST by fact_player_news_mention, before the
      normalized-name match. Normalization (case, punctuation, Jr/III) is not an
      alias: "D.J. Wonnum" and "Kenneth Walker" resolve without a row here.
      Grow this file from the unresolved names that
      assert_news_mentions_resolve surfaces; player_id is the BallDontLie id
      from RAW.PLAYERS.
    columns:
      - name: alias
        description: "Name as the news writes it. Matched after normalization."
        tests: [unique, not_null]
      - name: player_id
        tests:
          - not_null
          - relationships: {to: "source('nfl_raw', 'players')", field: id}

  - name: seed_nfl_stadiums
    description: >
      One row per exact RAW.GAMES.venue string. stadium_id collapses feed
      renames onto one physical bowl; Highmark old vs new stay two ids.
    columns:
      - name: venue_name
        description: "Exact match to RAW.GAMES.venue."
        tests: [unique, not_null]
      - name: stadium_id
        tests: [not_null]
      - name: display_name
        tests: [not_null]
      - name: lat
        tests: [not_null]
      - name: lon
        tests: [not_null]
      - name: roof
        tests:
          - not_null
          - accepted_values: {values: ['open', 'retractable', 'fixed']}
      - name: is_weather_relevant
        tests: [not_null]
      - name: is_international
        tests: [not_null]

  - name: seed_nfl_prop_stat_map
    description: >
      Which box-score stat a prop type is about, for app_game_prop_board.
      prop_type is a lowercased passthrough from the feed with no enumeration
      anywhere else, so this seed is the one place the mapping lives. An empty
      stat_key means the prop cannot be graded from the box score (first
      touchdown, quarter and half touchdowns); those rows keep their line and
      odds on the board with NULL form columns. A new prop type in the feed
      appears unmapped until a row is added here.
    columns:
      - name: prop_type
        tests: [unique, not_null]
      - name: stat_key
        tests:
          - accepted_values:
              values: ['receiving_yards', 'receptions', 'rushing_yards', 'passing_yards', 'passing_touchdowns', 'scoring_touchdowns']
