[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlt-snowflake-template"
version = "0.1.0"
requires-python = ">=3.11"
# REST API plus the Firecrawl SDK (pipelines/batch/firecrawl_source.py). dlt does
# not require sqlalchemy, connectorx, or pyarrow, and the
# Snowflake destination defaults to jsonl (duckdb to insert_values), so Arrow is
# not on the load path. pyarrow becomes required again only if you set
# loader_file_format="parquet", use filesystem staging, or call
# pipeline.dataset().arrow()/df().
# snowflake-telemetry-python is imported optionally by pipelines/common/observability.py,
# which falls back to a plain formatter when it is absent. That fallback is why the
# dependency went unnoticed for so long: without it every container log line is
# unstructured text and RECORD:severity_text in the event table is NULL, with nothing
# erroring anywhere.
#
# Be clear about what it buys. configure_logging attaches its handler to the
# `dlt_pipeline` logger and nothing else, and that logger is 385 of 13,514 measured
# lines, under 3%. dlt's own logger and snowflake.connector reach stdout by another
# path and stay raw whatever is installed. The regex parser in sql/ops/ is the primary
# path permanently; this only makes the small slice authoritative.
dependencies = [
    "dlt[snowflake]>=1.0",
    "dlt[postgres]>=1.0",            # nfl_app_to_postgres dest; image rebuild required
    "snowflake-connector-python>=3.7",   # imported directly by pipelines/common/snowflake_session.py
    "pyyaml>=6",                         # imported directly by pipelines/batch/models.py
    "snowflake-telemetry-python>=0.6",   # optional import in pipelines/common/observability.py
    "firecrawl-py>=4.38",                # imported inside pipelines/batch/firecrawl_source.py
    "feedparser>=6",                     # imported inside pipelines/batch/firecrawl_source.py
    "nflreadpy>=0.1.5",                  # imported inside pipelines/batch/nflverse_source.py; brings polars; image rebuild required
]

[project.optional-dependencies]
# jinja2 is not used at run time. It is here so tests/test_spec_templates.py can parse
# the SPCS job specs with the same engine Snowflake renders them with, which is the
# only way to catch a bad placeholder without spending a container run.
dev = ["duckdb", "dlt[duckdb]", "jinja2", "pytest>=8", "ruff>=0.15,<0.16"]
# `make plan` only. Both already arrive transitively via dlt, but the doc build
# must not depend on that staying true.
docs = ["markdown-it-py>=3", "pygments>=2"]

[tool.setuptools.packages.find]
# Auto-discover pipelines + every subpackage (batch, common).
include = ["pipelines*"]

[tool.ruff]
line-length = 100
