# SPCS job spec template for a scheduled dlt pipeline that authenticates with
# no source secret (Open-Meteo). Same as dlt_job.tmpl.yaml minus the secrets
# block. generate_tasks.render_spec picks this file when spec.secret is empty.
#
# Destination auth is the ambient SPCS OAuth token. Egress still comes from the
# Task's EXTERNAL_ACCESS_INTEGRATIONS clause, not from this file.
#
# THE RENDERER IS JINJA2 AND DOES NOT KNOW WHAT A COMMENT IS.
#     Every delimiter in this header is live. Describe variables in prose.
spec:
  containers:
    - name: dlt
      image: /DLT_DB/DEPLOY/IMAGES/dlt-pipeline:latest
      args:
        - {{ pipeline }}
      env:
        DESTINATION__SNOWFLAKE__CREDENTIALS__AUTHENTICATOR: oauth
        DESTINATION__SNOWFLAKE__CREDENTIALS__DATABASE: {{ database }}
        DESTINATION__SNOWFLAKE__CREDENTIALS__WAREHOUSE: DLT_WH
        SNOWFLAKE_WAREHOUSE: DLT_WH
        SNOWFLAKE_DATABASE: DLT_DB
        DLT_REGISTRY_SOURCE: auto
        LOG_LEVEL: INFO
        DLT_ALERTS: "1"
  platformMonitor:
    metricConfig:
      groups:
        - system
        - system_limits
        - status
        - network
        - storage
