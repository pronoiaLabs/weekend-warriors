# SPCS job spec for a pipeline whose destination is Snowflake Postgres.
#
# Same renderer rules as dlt_job.tmpl.yaml: every delimiter is live. Describe
# variables in prose, not braces. generate_tasks.py picks this file when
# spec.destination == postgres.
#
# Source Snowflake stays the ambient OAuth session (SNOWFLAKE_* / token file).
# Destination password is the only secret, bound to
# DESTINATION__POSTGRES__CREDENTIALS__PASSWORD — not SOURCES__NFL__API_KEY.
#
# Host / user / database are env, not secrets. The host comes from .env.postgres
# PGHOST (generate_tasks.py fills {{ pg_host }}, falling back to the owner's
# instance when PGHOST is unset), the same value apply_network.sh renders into
# the POSTGRES_APP_EAI network rule -- one record, two consumers.
#
# LOAD__WORKERS defaults to 20. Concurrent insert_values jobs of that width
# OOMed Snowflake Postgres (2026-08-24). DATA_WRITER__FILE_MAX_ITEMS keeps
# each INSERT VALUES statement off the instance memory ceiling.
spec:
  containers:
    - name: dlt
      image: /DLT_DB/DEPLOY/IMAGES/dlt-pipeline:latest
      args:
        - {{ pipeline }}
      env:
        DLT_DESTINATION: postgres
        DLT_DATASET: {{ dataset }}
        SNOWFLAKE_APP_DATABASE: {{ app_database }}
        DESTINATION__POSTGRES__CREDENTIALS__HOST: {{ pg_host }}
        DESTINATION__POSTGRES__CREDENTIALS__PORT: "5432"
        DESTINATION__POSTGRES__CREDENTIALS__DATABASE: app
        DESTINATION__POSTGRES__CREDENTIALS__USERNAME: app_copy_writer
        PGSSLMODE: require
        LOAD__WORKERS: "3"
        DATA_WRITER__FILE_MAX_ITEMS: "2000"
        DESTINATION__SNOWFLAKE__CREDENTIALS__AUTHENTICATOR: oauth
        DESTINATION__SNOWFLAKE__CREDENTIALS__DATABASE: {{ database }}
        DESTINATION__SNOWFLAKE__CREDENTIALS__WAREHOUSE: DLT_WH
        SNOWFLAKE_WAREHOUSE: DLT_WH
        SNOWFLAKE_DATABASE: DLT_DB
        DLT_REGISTRY_SOURCE: auto
        LOG_LEVEL: INFO
        DLT_ALERTS: "1"
      secrets:
        - snowflakeSecret: {{ secret }}
          secretKeyRef: secret_string
          envVarName: {{ env_var }}
  platformMonitor:
    metricConfig:
      groups:
        - system
        - system_limits
        - status
        - network
        - storage
